<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotiky – Play Spotify at any timestamp</title>

  <!-- Open Graph / Discord / Twitter embeds -->
  <meta property="og:title" content="Spotiky – Play Spotify at Timestamp">
  <meta property="og:description" content="Click to play this Spotify track starting at the chosen time.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://spotiky.com">
  <meta property="og:image" content="https://spotiky.com/og.png">
  <meta name="theme-color" content="#1DB954">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px;
      background: #121212;
      color: #fff;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 4px;
      font-weight: 700;
    }
    .subtitle {
      color: #b3b3b3;
      margin: 0 0 28px;
      font-size: 0.95rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #b3b3b3;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #282828;
      color: white;
    }
    input:focus {
      outline: 2px solid #1DB954;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }
    .row input { margin-bottom: 0; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #1DB954;
      color: white;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #1ed760; }
    button.secondary {
      background: #282828;
      margin-top: 10px;
    }
    button.secondary:hover { background: #3e3e3e; }
    #status {
      margin-top: 18px;
      color: #b3b3b3;
      min-height: 24px;
      font-size: 0.9rem;
    }
    #embed {
      margin-top: 24px;
      border-radius: 12px;
      overflow: hidden;
      background: #181818;
    }
    .hint {
      font-size: 0.8rem;
      color: #666;
      margin-top: 24px;
    }
  </style>

  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>
<body>
  <h1>Spotiky</h1>
  <p class="subtitle">Play any Spotify track from a specific timestamp</p>

  <label for="link">Spotify track link or ID</label>
  <input id="link" placeholder="https://open.spotify.com/track/… or track ID" autocomplete="off">

  <label for="time">Start time</label>
  <input id="time" placeholder="1:23  or  83" autocomplete="off">

  <button onclick="play()">Play from timestamp</button>
  <button class="secondary" onclick="copyShareLink()">Copy shareable link</button>

  <div id="status">Waiting for player…</div>
  <div id="embed"></div>

  <p class="hint">
    Works best when you're logged into Spotify in this browser.<br>
    Share links look like: <code>spotiky.com/?track=ID&t=83</code>
  </p>

  <script>
    let controller = null;
    let pendingTrack = null;
    let pendingSeconds = 0;

    function parseTime(t) {
      if (!t) return 0;
      t = String(t).trim();
      if (t.includes(':')) {
        const parts = t.split(':').map(Number);
        if (parts.length === 2) return parts[0] * 60 + (parts[1] || 0);
        if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + (parts[2] || 0);
      }
      return parseInt(t, 10) || 0;
    }

    function extractTrackId(input) {
      if (!input) return null;
      const str = String(input).trim();
      // Matches open.spotify.com/track/ID, spotify:track:ID, or raw 22-char ID
      const match = str.match(/(?:track[/:]|spotify:track:)([a-zA-Z0-9]{22})/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9]{22}$/.test(str)) return str;
      return null;
    }

    function play(trackId = null, seconds = null) {
      const status = document.getElementById('status');

      if (!trackId) {
        trackId = extractTrackId(document.getElementById('link').value);
        seconds = parseTime(document.getElementById('time').value);
      }

      if (!trackId) {
        status.textContent = 'Please enter a valid Spotify track link or ID';
        return;
      }

      // Update the URL so the link is shareable
      const newUrl = `${location.origin}/?track=${trackId}&t=${seconds}`;
      history.replaceState(null, '', newUrl);

      if (!controller) {
        pendingTrack = trackId;
        pendingSeconds = seconds;
        status.textContent = 'Player loading… will start automatically';
        return;
      }

      status.textContent = `Loading track at ${seconds}s…`;

      // Load the track starting at the desired time
      controller.loadEntity(`spotify:track:${trackId}`, false, seconds);

      // Attempt to play (browsers often block autoplay)
      const tryPlay = (attempt = 1) => {
        controller.play();
        status.textContent = `Playing from ${formatTime(seconds)}`;
        if (attempt < 5) {
          setTimeout(() => tryPlay(attempt + 1), 500 * attempt);
        }
      };

      setTimeout(() => tryPlay(1), 700);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m > 0 ? `${m}:${String(s).padStart(2, '0')}` : `${s}s`;
    }

    function copyShareLink() {
      const trackId = extractTrackId(document.getElementById('link').value);
      const seconds = parseTime(document.getElementById('time').value);

      if (!trackId) {
        document.getElementById('status').textContent = 'Enter a track first';
        return;
      }

      const url = `https://spotiky.com/?track=${trackId}&t=${seconds}`;
      navigator.clipboard.writeText(url).then(() => {
        document.getElementById('status').textContent = 'Link copied!';
      }).catch(() => {
        // Fallback
        prompt('Copy this link:', url);
      });
    }

    function readUrlAndPlay() {
      // Hash style (legacy): #track/ID.83
      const hash = window.location.hash.slice(1);
      const hashMatch = hash.match(/^track\/([a-zA-Z0-9]{22})\.(\d+)$/);
      if (hashMatch) {
        const id = hashMatch[1];
        const sec = parseInt(hashMatch[2], 10);
        document.getElementById('link').value = id;
        document.getElementById('time').value = sec;
        play(id, sec);
        return;
      }

      // Query style (recommended): ?track=ID&t=83
      const params = new URLSearchParams(window.location.search);
      if (params.get('track')) {
        const id = extractTrackId(params.get('track'));
        const sec = parseTime(params.get('t') || '0');
        document.getElementById('link').value = params.get('track');
        document.getElementById('time').value = params.get('t') || '0';
        if (id) play(id, sec);
      }
    }

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      const element = document.getElementById('embed');
      IFrameAPI.createController(element, {
        width: '100%',
        height: 152,
        theme: 'dark'
      }, (c) => {
        controller = c;
        document.getElementById('status').textContent = 'Player ready – enter a track';

        // Play anything that arrived while the player was loading
        if (pendingTrack) {
          play(pendingTrack, pendingSeconds);
          pendingTrack = null;
        }
      });
    };

    // Run on first load
    readUrlAndPlay();

    // React to browser navigation
    window.addEventListener('hashchange', readUrlAndPlay);
    window.addEventListener('popstate', readUrlAndPlay);
  </script>
</body>
</html>
