<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotiky – Play Spotify at any timestamp</title>
  <meta property="og:title" content="Spotiky – Play Spotify at Timestamp">
  <meta property="og:description" content="Click to play this Spotify track starting at the chosen time.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://spotiky.com">
  <meta property="og:image" content="https://spotiky.com/og.png">
  <meta name="theme-color" content="#1DB954">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px;
      background: #121212;
      color: #fff;
      line-height: 1.5;
    }
    h1 { font-size: 1.75rem; margin: 0 0 4px; font-weight: 700; }
    .subtitle { color: #b3b3b3; margin: 0 0 28px; font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; color: #b3b3b3; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #282828;
      color: white;
    }
    input:focus { outline: 2px solid #1DB954; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #1DB954;
      color: white;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #1ed760; }
    button.secondary { background: #282828; margin-top: 10px; }
    button.secondary:hover { background: #3e3e3e; }
    #status {
      margin-top: 18px;
      color: #b3b3b3;
      min-height: 24px;
      font-size: 0.9rem;
    }
    #embed {
      margin-top: 24px;
      border-radius: 12px;
      overflow: hidden;
      background: #181818;
    }
    #previewPlayer {
      margin-top: 16px;
      display: none;
      background: #181818;
      border-radius: 12px;
      padding: 16px;
    }
    #previewPlayer audio { width: 100%; margin-top: 8px; }
    .hint { font-size: 0.8rem; color: #666; margin-top: 24px; }
    code { background: #282828; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
  </style>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>
<body>
  <h1>Spotiky</h1>
  <p class="subtitle">Play any Spotify track from a specific timestamp</p>

  <label for="link">Spotify track link or ID</label>
  <input id="link" placeholder="https://open.spotify.com/track/… or track ID" autocomplete="off">

  <label for="time">Start time</label>
  <input id="time" placeholder="1:23  ·  1.23  ·  83" autocomplete="off">

  <button onclick="play()">Play from timestamp</button>
  <button class="secondary" onclick="copyShareLink()">Copy shareable link</button>

  <div id="status">Waiting for player…</div>
  <div id="embed"></div>

  <div id="previewPlayer">
    <div style="font-size:0.9rem;color:#b3b3b3;margin-bottom:4px;">30-second preview (fallback)</div>
    <audio id="previewAudio" controls></audio>
  </div>

  <p class="hint">
    Full tracks work best when you're logged into Spotify in this browser.<br>
    Otherwise you'll get a 30-second preview.<br><br>
    Share links: <code>open.spotiky.com/track/ID$83</code> or <code>&amp;t=1:23</code>
  </p>

  <script>
    const PREVIEW_WORKER = "https://spotiky-preview.spotikyhq.workers.dev";

    let controller = null;
    let pendingTrack = null;
    let pendingSeconds = 0;
    let fallbackTimer = null;
    let currentTrackId = null;

    function parseTime(t) {
      if (!t) return 0;
      t = String(t).trim().replace(',', '.');
      if (t.includes(':')) {
        const parts = t.split(':').map(p => parseFloat(p) || 0);
        if (parts.length === 2) return Math.floor(parts[0] * 60 + parts[1]);
        if (parts.length === 3) return Math.floor(parts[0] * 3600 + parts[1] * 60 + parts[2]);
      }
      if (t.includes('.')) {
        const [m, s] = t.split('.').map(p => parseFloat(p) || 0);
        return Math.floor(m * 60 + s);
      }
      return parseInt(t, 10) || 0;
    }

    function extractTrackId(input) {
      if (!input) return null;
      const str = String(input).trim();
      const match = str.match(/(?:track[/:]|spotify:track:)([a-zA-Z0-9]{22})/);
      if (match) return match[1];
      if (/^[a-zA-Z0-9]{22}$/.test(str)) return str;
      return null;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m > 0 ? `${m}:${String(s).padStart(2, '0')}` : `${s}s`;
    }

    function buildShareUrl(trackId, seconds) {
      return `https://open.spotiky.com/track/${trackId}$${seconds}`;
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    async function tryPreviewFallback(trackId) {
      try {
        setStatus('Trying 30-second preview…');
        const res = await fetch(`${PREVIEW_WORKER}/?id=${trackId}`);
        const data = await res.json();

        if (!data.preview_url) {
          setStatus('No preview available for this track. Try clicking the green ▶ in the player above.');
          return;
        }

        const audio = document.getElementById('previewAudio');
        const box = document.getElementById('previewPlayer');
        audio.src = data.preview_url;
        box.style.display = 'block';
        audio.play().catch(() => {});
        setStatus(`Playing 30s preview${data.name ? ': ' + data.name : ''}`);
      } catch (e) {
        setStatus('Preview failed. Click the green ▶ button in the Spotify player above.');
      }
    }

    function play(trackId = null, seconds = null) {
      if (!trackId) {
        trackId = extractTrackId(document.getElementById('link').value);
        seconds = parseTime(document.getElementById('time').value);
      }
      if (!trackId) {
        setStatus('Please enter a valid Spotify track link or ID');
        return;
      }

      currentTrackId = trackId;
      document.getElementById('previewPlayer').style.display = 'none';
      document.getElementById('previewAudio').src = '';

      // Clean shareable URL
      history.replaceState(null, '', `/track/${trackId}$${seconds}`);

      if (!controller) {
        pendingTrack = trackId;
        pendingSeconds = seconds;
        setStatus('Player loading… will start automatically');
        return;
      }

      setStatus(`Loading track at ${formatTime(seconds)}…`);
      controller.loadEntity(`spotify:track:${trackId}`, false, seconds);

      // Try to start playback
      const tryPlay = (attempt = 1) => {
        controller.play();
        if (attempt < 4) {
          setTimeout(() => tryPlay(attempt + 1), 400 * attempt);
        }
      };
      setTimeout(() => tryPlay(1), 600);

      // If nothing is playing after ~2.5s, fall back to real preview
      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(() => {
        tryPreviewFallback(trackId);
      }, 2500);
    }

    function copyShareLink() {
      const trackId = extractTrackId(document.getElementById('link').value);
      const seconds = parseTime(document.getElementById('time').value);
      if (!trackId) {
        setStatus('Enter a track first');
        return;
      }
      const url = buildShareUrl(trackId, seconds);
      navigator.clipboard.writeText(url).then(() => {
        setStatus('Link copied!');
      }).catch(() => {
        prompt('Copy this link:', url);
      });
    }

    function readUrlAndPlay() {
      const path = window.location.pathname + window.location.search + window.location.hash;
      const full = window.location.href;

      // Preferred: /track/ID$83  or  /track/ID&t=83
      let m = path.match(/\/track\/([a-zA-Z0-9]{22})(?:\$|&t=)([^&#\s]+)/i)
           || full.match(/\/track\/([a-zA-Z0-9]{22})(?:\$|&t=)([^&#\s]+)/i);

      if (m) {
        const id = m[1];
        const sec = parseTime(m[2]);
        document.getElementById('link').value = id;
        document.getElementById('time').value = m[2];
        play(id, sec);
        return;
      }

      // Legacy hash
      const hash = window.location.hash.slice(1);
      const hashMatch = hash.match(/^track\/([a-zA-Z0-9]{22})\.(\d+)$/);
      if (hashMatch) {
        const id = hashMatch[1];
        const sec = parseInt(hashMatch[2], 10);
        document.getElementById('link').value = id;
        document.getElementById('time').value = sec;
        play(id, sec);
        return;
      }

      // Classic query
      const params = new URLSearchParams(window.location.search);
      if (params.get('track')) {
        const id = extractTrackId(params.get('track'));
        const sec = parseTime(params.get('t') || '0');
        document.getElementById('link').value = params.get('track');
        document.getElementById('time').value = params.get('t') || '0';
        if (id) play(id, sec);
      }
    }

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      const element = document.getElementById('embed');
      IFrameAPI.createController(element, {
        width: '100%',
        height: 152,
        theme: 'dark'
      }, (c) => {
        controller = c;

        // Cancel fallback if the embed actually starts playing
        c.addListener('playback_update', (e) => {
          if (e.data && !e.data.isPaused && e.data.position > 0) {
            clearTimeout(fallbackTimer);
            document.getElementById('previewPlayer').style.display = 'none';
            setStatus(`Playing from ${formatTime(Math.floor(e.data.position / 1000))}`);
          }
        });

        setStatus('Player ready – enter a track');
        if (pendingTrack) {
          play(pendingTrack, pendingSeconds);
          pendingTrack = null;
        }
      });
    };

    readUrlAndPlay();
    window.addEventListener('hashchange', readUrlAndPlay);
    window.addEventListener('popstate', readUrlAndPlay);
  </script>
</body>
</html>
